name: Deploy install page

# Republishes the install page (docs/index.html, manifest, etc.) to GitHub
# Pages without requiring a new firmware release. Triggers on changes under
# docs/ on the main branch and on manual dispatch.
#
# Firmware binaries themselves are pulled from the most recent GitHub
# Release — those are produced by release.yml on tag pushes. This workflow
# re-stages the latest tagged binaries alongside the (possibly updated)
# docs/ content so the install page stays current as you iterate on the UI.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys across this workflow and release.yml's deploy-pages
# job so two simultaneous deploys don't race against each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fetch the currently-deployed firmware binaries from the live Pages
      # site and re-include them in this deploy. Pages publishes are full
      # site replacements, so we have to carry the firmware forward
      # ourselves each time docs/ changes. If the site has never been
      # deployed (first-time bootstrap), the curls fail and we deploy the
      # install page without firmware — the install button is broken until
      # release.yml runs on a tag.
      - name: Pull current firmware from live Pages
        run: |
          BASE="https://g-two.github.io/smoke-x-receiver/firmware"
          MISSING=0
          for board in heltec-v2 heltec-v3; do
            mkdir -p "pages-staging/firmware/$board"
            for file in bootloader.bin partition-table.bin smoke-x.bin storage.bin "smoke-x-receiver-$board.bin"; do
              if ! curl -sfL -o "pages-staging/firmware/$board/$file" "$BASE/$board/$file"; then
                echo "::warning::Failed to fetch $board/$file from $BASE — install page may be missing firmware until next release"
                MISSING=$((MISSING + 1))
              fi
            done
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::warning::$MISSING firmware files were not fetched. If this is the first deploy, ignore — they'll appear once release.yml runs on a tag."
          fi
          # Re-hash whatever we ended up with.
          if compgen -G "pages-staging/firmware/*/*.bin" >/dev/null; then
            (cd pages-staging/firmware && find . -type f -name '*.bin' | sort | xargs sha256sum > SHA256SUMS.txt)
          fi

      - name: Stage docs into pages content
        run: cp -r docs/. pages-staging/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
