name: Release

# Builds firmware for both Heltec V2 and V3 boards, merges each into a single
# flashable image with esptool merge_bin, and attaches the results to the
# GitHub Release. The merged binaries are consumed by ESP Web Tools running
# from the GitHub Pages site (docs/index.html, docs/manifest.json) so end
# users can flash directly from a Chromium-based browser.
#
# Triggered automatically on tag pushes matching v*. Also exposable as a
# manual run via the Actions tab (workflow_dispatch) so the build can be
# smoke-tested without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    strategy:
      fail-fast: false
      matrix:
        board: [heltec-v2, heltec-v3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The official ESP-IDF image is Ubuntu 22.04 whose apt-provided Node is
      # too old for Vite 4 — use setup-node to install a current LTS.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web UI dependencies
        run: make web-ui-install

      # PROJECT_VER gets embedded into esp_app_desc and reported via MQTT
      # discovery. For tag-triggered runs github.ref_name is the tag (e.g.
      # v0.2.0); for workflow_dispatch on a branch it's the branch name.
      - name: Build and merge firmware for ${{ matrix.board }}
        run: make dist-${{ matrix.board }} PROJECT_VER=${{ github.ref_name }}

      # Stage both the merged binary (for command-line flashing) and the
      # individual partition files (consumed by ESP Web Tools as multi-part
      # manifest entries — this layout preserves NVS on update).
      - name: Stage firmware files
        run: |
          mkdir -p firmware-staging/${{ matrix.board }}
          cp build/${{ matrix.board }}/smoke-x-receiver-${{ matrix.board }}.bin \
             firmware-staging/${{ matrix.board }}/
          cp build/${{ matrix.board }}/bootloader/bootloader.bin \
             firmware-staging/${{ matrix.board }}/
          cp build/${{ matrix.board }}/partition_table/partition-table.bin \
             firmware-staging/${{ matrix.board }}/
          cp build/${{ matrix.board }}/smoke-x.bin \
             firmware-staging/${{ matrix.board }}/
          cp build/${{ matrix.board }}/storage.bin \
             firmware-staging/${{ matrix.board }}/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: firmware-staging
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true

      # Collect just the merged single-file binaries for the GitHub release
      # asset list. The individual partition files live in dist/heltec-*/
      # too but are only consumed by the web installer (via Pages), not
      # advertised on the release page.
      - name: Collect merged release binaries
        run: |
          mkdir -p release-assets
          cp dist/heltec-*/smoke-x-receiver-*.bin release-assets/
          cd release-assets
          sha256sum *.bin > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.bin
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Publish the install page to GitHub Pages alongside the firmware binaries.
  # GitHub release downloads don't send CORS headers, so the binaries are
  # served from the same origin as docs/index.html. Requires the Pages source
  # to be set to "GitHub Actions" in repo Settings → Pages.
  deploy-pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Shared concurrency group with pages.yml so a tag-triggered deploy and a
    # docs-triggered deploy never race against each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: pages-staging/firmware
          pattern: firmware-*
          merge-multiple: true

      # Hash everything under firmware/ so users can verify either the merged
      # binary or any of the individual partition files post-download.
      - name: Generate SHA256 checksums
        working-directory: pages-staging/firmware
        run: find . -type f -name '*.bin' | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Stage docs into pages content
        run: cp -r docs/. pages-staging/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
